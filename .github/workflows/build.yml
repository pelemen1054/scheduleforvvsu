name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.13
        run: |
          wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d "$HOME/gradle"

      - name: Build APK
        run: |
          "$HOME/gradle/gradle-8.13/bin/gradle" :app:assembleDebug --no-daemon
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          cp app/build/outputs/apk/debug/app-debug.apk VVSU_timetable.apk
          echo "Built VVSU timetable version ${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VVSU_timetable_v${{ github.run_number }}
          path: VVSU_timetable.apk
