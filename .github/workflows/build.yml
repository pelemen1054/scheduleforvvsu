name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vvsu-release.jks"
          test -s "$RUNNER_TEMP/vvsu-release.jks"

      - name: Download Gradle 8.13
        run: |
          wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d "$HOME/gradle"

      - name: Build signed release APK
        id: build_apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
          "$HOME/gradle/gradle-8.13/bin/gradle" :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/vvsu-release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          APK_NAME="VVSU_timetable_v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Built signed VVSU Timetable version $VERSION_NAME"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.build_apk.outputs.apk_name }}"
          sha256sum "${{ steps.build_apk.outputs.apk_name }}"

      - name: Generate release notes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          VERSION_NAME: ${{ steps.build_apk.outputs.version_name }}
          APK_NAME: ${{ steps.build_apk.outputs.apk_name }}
        run: |
          {
            echo "# ВВГУ Timetable v${VERSION_NAME}"
            echo
            awk -v version="${VERSION_NAME}" '
              index($0, "## [" version "]") == 1 { printing=1; print; next }
              printing && index($0, "## [") == 1 { exit }
              printing { print }
            ' CHANGELOG.md
            echo
            echo "---"
            echo
            echo "Файл приложения: \`${APK_NAME}\`"
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build_apk.outputs.version_name }}
          name: ВВГУ Timetable v${{ steps.build_apk.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.build_apk.outputs.apk_name }}
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVSU_timetable_v${{ steps.build_apk.outputs.version_name }}
          path: ${{ steps.build_apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
